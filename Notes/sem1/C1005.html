<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        .pdf-box {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        embed {
            width: 100%;
            height: 600px;
            border: none;
        }

        .btn-group {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 30px;
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: 0.3s;
        }

        .download {
            background: #28a745;
        }

        .download:hover {
            background: #218838;
        }

        .open {
            background: #007bff;
        }

        .open:hover {
            background: #0056b3;
        }

        .footer1 {
    background: #f2f2f2;   /* light grey background */
    text-align: center;
    padding: 20px 10px;
    border-top: 1px solid #ddd;
}

.footer1 .credit {
    font-size: 14px;
    color: #333;
    line-height: 1.8;
}

.footer1 .credit p {
    margin: 2px 0;
    font-size: 12px;
    color: #777;
}

/* BCA Study Zone text */
.footer1 .credit span {
    color: red;
    font-weight: 500;
}

/* Developer link */
.footer1 .credit a {
    color: red;
    text-decoration: none;
    font-weight: 500;
}

.footer1 .credit a:hover {
    text-decoration: underline;
}

        @media(max-width: 600px){
            embed {
                height: 400px;
            }
        }
    </style>
</head>
